name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release v1.14.0"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build release (unsigned)
        run: |
          chmod +x gradlew
          for attempt in 1 2; do
            ./gradlew :app:assembleRelease --stacktrace && break
            if [ "$attempt" = "2" ]; then exit 1; fi
            echo "Build attempt $attempt failed; retrying in 45s (transient Maven rate limits are common)..."
            sleep 45
          done

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Build tools: $BT"
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks keystore/ysync-release.jks \
            --ks-key-alias ysync \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out Y-SYNC-1.14.0.apk aligned.apk
          "$BT/apksigner" verify --print-certs Y-SYNC-1.14.0.apk
          sha256sum Y-SYNC-1.14.0.apk > Y-SYNC-1.14.0.apk.sha256
          ls -lh Y-SYNC-1.14.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Y-SYNC-1.14.0
          path: |
            Y-SYNC-1.14.0.apk
            Y-SYNC-1.14.0.apk.sha256

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.14.0
          name: Y-SYNC v1.14.0
          files: |
            Y-SYNC-1.14.0.apk
            Y-SYNC-1.14.0.apk.sha256
          body: |
            **Y-SYNC 1.14.0** — A real home feed: Beranda now shows videos, not just livestreams. Free and open source (GPL-3.0).

            - New: Beranda is a real home feed now — recommended videos you can keep scrolling, like the YouTube home page (the Live-only page is still available in the drawer)
            - New: Shorts — a full-screen vertical feed that keeps loading as you swipe, just like YouTube (open it from the menu drawer)
            - New: the mini player now shows the playing video itself, floating as a rounded card above the tab bar
            - Fixed: the comments screen top bar no longer washes out or covers the first comment
            - Fixed: the mini player strip no longer overlaps the Shorts feed
            - Fixed: the tab bar could appear on top of fullscreen videos after rotating to landscape — fullscreen now always hides it
            - New: the mini player floats as a rounded card above the tab bar while you browse, instead of merging into one full-width block
            - Fixed: floating top/bottom bars could pop in late on a cold start — they are now in their final state from the first frame
            - Fixed: big cards now actually apply on existing installs (the Auto view mode itself now means big cards)
            - New: video lists now use big full-width thumbnail cards, YouTube-style (switch back anytime in Settings → Appearance → List view mode)
            - New: the top bar now floats like the bottom bar — a glass pill with side margins and rounded corners
            - Fixed: bottom tab bar missing on list screens until a video had been opened once
            - Mini player now stacks neatly above the tab bar — both stay visible while you browse
            - New: the top bar is real liquid glass too — lists scroll behind it and blur, like the bottom bar
            - Themes: purple removed — plain dark / plain white, always following the system
            - Fixed: floating bar no longer appears over videos or sticks out under the mini player
            - Fixed: Menu tab opens the drawer every time you tap it
            - Icon: play button resized to match the reference look
            - Fixed: 1.3.0 crash when opening videos/search; personal access code gate; in-app update notifications
            - Floating bottom bar is REAL frosted glass with live backdrop blur, 5 tabs: Home, What's New, Subscriptions, Bookmarks, Menu
            - Home opens straight into Live streams and videos — no more empty trending charts
            - Watch videos and live streams while they are on air — no ads
            - Background playback, popup/PiP player, downloads up to 4K
            - Local subscriptions and history — no Google account needed

            Install: download `Y-SYNC-1.14.0.apk` below and open it on your Android phone.
