name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release v1.4.0"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build release (unsigned)
        run: |
          chmod +x gradlew
          for attempt in 1 2; do
            ./gradlew :app:assembleRelease --stacktrace && break
            if [ "$attempt" = "2" ]; then exit 1; fi
            echo "Build attempt $attempt failed; retrying in 45s (transient Maven rate limits are common)..."
            sleep 45
          done

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Build tools: $BT"
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks keystore/ysync-release.jks \
            --ks-key-alias ysync \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out Y-SYNC-1.4.0.apk aligned.apk
          "$BT/apksigner" verify --print-certs Y-SYNC-1.4.0.apk
          sha256sum Y-SYNC-1.4.0.apk > Y-SYNC-1.4.0.apk.sha256
          ls -lh Y-SYNC-1.4.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Y-SYNC-1.4.0
          path: |
            Y-SYNC-1.4.0.apk
            Y-SYNC-1.4.0.apk.sha256

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Y-SYNC v1.4.0
          files: |
            Y-SYNC-1.4.0.apk
            Y-SYNC-1.4.0.apk.sha256
          body: |
            **Y-SYNC 1.4.0** — Access code, new icon, crash fixed. Free and open source (GPL-3.0).

            - Fixed: 1.3.0 crashed when opening videos/search (image bitmaps vs. blur capture)
            - New: personal access code gate (owner/guest code, asked once per install)
            - New: YouTube-style play button app icon
            - Fixed: in-app update notifications now actually work — future updates arrive as a notification
            - Floating bottom bar is REAL frosted glass with live backdrop blur, 5 tabs: Home, What's New, Subscriptions, Bookmarks, Menu
            - Home opens straight into Live streams and videos — no more empty trending charts
            - Watch videos and live streams while they are on air — no ads
            - Background playback, popup/PiP player, downloads up to 4K
            - Local subscriptions and history — no Google account needed

            Install: download `Y-SYNC-1.4.0.apk` below and open it on your Android phone.
