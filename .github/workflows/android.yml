name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release v1.1.0"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build release (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Build tools: $BT"
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks keystore/ysync-release.jks \
            --ks-key-alias ysync \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out Y-SYNC-1.1.0.apk aligned.apk
          "$BT/apksigner" verify --print-certs Y-SYNC-1.1.0.apk
          sha256sum Y-SYNC-1.1.0.apk > Y-SYNC-1.1.0.apk.sha256
          ls -lh Y-SYNC-1.1.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Y-SYNC-1.1.0
          path: |
            Y-SYNC-1.1.0.apk
            Y-SYNC-1.1.0.apk.sha256

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Y-SYNC v1.1.0
          files: |
            Y-SYNC-1.1.0.apk
            Y-SYNC-1.1.0.apk.sha256
          body: |
            **Y-SYNC 1.1.0** — Liquid Glass edition. Free and open source (GPL-3.0).

            - New Liquid Glass UI: frosted translucent surfaces, Aurora gradient bar, rounded glass cards
            - iOS-style motion: springy screen transitions, staggered list entrances, press feedback
            - Watch videos and live streams while they are on air — no ads
            - Background playback, popup/PiP player, downloads up to 4K
            - Local subscriptions and history — no Google account needed

            Install: download `Y-SYNC-1.1.0.apk` below and open it on your Android phone.
